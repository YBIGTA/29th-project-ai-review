services:
  api:
    build: .
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: postgresql://ai_review:ai_review@db:5432/ai_review
      VECTOR_DB_PATH: /app/vector_db
      AUTH_COOKIE_SECURE: "false"
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/backend/data
      - ./vector_db:/app/vector_db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_review
      POSTGRES_USER: ai_review
      POSTGRES_PASSWORD: ai_review
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_review -d ai_review"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  backend_data:
  postgres_data:
